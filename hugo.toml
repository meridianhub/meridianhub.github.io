baseURL = 'https://www.meridianhub.org/'
languageCode = 'en-gb'
title = 'Meridian'
copyright = '© 2025-2026 Meridian Hub Ltd'

# Build settings
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = false
disableKinds = ["taxonomy", "term"]

[params]
  description = "Declare your economy in a manifest. Meridian runs it: durable sagas on a double-entry ledger, for money, megawatts, and anything else of value."
  author = "Meridian"
  demoURL = "https://demo.meridianhub.cloud"
  repoURL = "https://github.com/meridianhub/meridian"
  contactEmail = "ben@meridianhub.org"

[menu]
  [[menu.main]]
    identifier = "energy"
    name = "Energy"
    url = "/energy/"
    weight = 10
  [[menu.main]]
    identifier = "cookbook"
    name = "Cookbook"
    url = "/cookbook/"
    weight = 20
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/meridianhub/meridian"
    weight = 50

# Minify output
[minify]
  minifyOutput = true

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = true
    style = "native"

[outputs]
  home = ["HTML"]

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
